<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>视频通话（独立页）</title>
<!--
  ============================================================================
  330 视频通话 · 独立页面沙盒  (2026-10-20)

  为什么有这个页:
    通话本身(Live2D / 麦克风 / TTS / WebGL)装在主页面里久了会发烫。
    主页面有 9146 个节点、128 个 JS 模块、34 个 CSS 文件常驻。
    实测把其它屏幕摘掉也不能解决 —— 所以改成"换宿主": 整个通话搬到一个
    只有约 80 个节点的独立文档里跑。

  和家庭影院 cinema-sandbox 是同一套思路:
    模块文件【一行不改】, 加载的是和生产完全同一份
    ../modules/video-voice-call.js、live2d-loader.js、call-lip-sync.js、tts-audio.js …

  本页放在项目根目录(不是子目录)是故意的:
    通话模块里有 assets/audio/call-waiting.mp3 这类【相对页面 URL】的路径,
    放在子目录会 404。放根目录 → assets/ modules/ css/ 全部零改动。

  ⚠️ 本页【不含准备页】(#live2d-call-prep-screen):
    宿主那边已经显示过准备页了, 用户是从那儿点「独立页通话(新)」进来的。
    沙盒再显示一个就是"准备页套准备页" —— 用户会以为进不去,
    而且准备页依赖 getUserAvatarUrl 等宿主函数, 沙盒里没有。
    沙盒从【呼叫等待页】开始。

  和宿主通信 (postMessage):
    宿主 → 本页  { type:'vcall:init', payload:{ chat, apiConfig, globalSettings,
                                                character, worldBooks, qzoneSettings } }
    本页 → 宿主  { type:'vcall:ready' }             入口已拉起(停在呼叫等待页)
                  { type:'vcall:needChat' }         缺数据, 请再发一次
                  { type:'vcall:openChat', chatId }  挂断后请宿主回聊天页并摘掉 iframe
                  { type:'vcall:close', chatId }     取消/退出, 请宿主摘掉 iframe
                  { type:'vcall:summarizeCall', chatId, transcript }  记忆总结(宿主做)
                  { type:'vcall:appendMessage', chatId, message }     拍一拍追加消息
                  { type:'vcall:chatUpdated', chatId }               内存 state 该刷新了
                  { type:'vcall:error', reason }

  iOS 关键约束:
    getUserMedia 和 AudioContext.resume 必须由【iframe 内】的真实用户手势触发。
    所以 iframe 带 allow="camera; microphone; autoplay",
    呼叫等待页里的「启用音频」按钮也在本页里(点它可再解一次锁)。
  ============================================================================ -->

<style>
  /* 沙盒外壳: 只服务这个文档, 不影响生产样式 */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1c1c1e;
    -webkit-tap-highlight-color: transparent;
  }
  #sandbox-root { position: relative; width: 100%; height: 100%; }

  /* 首次加载 / 等宿主数据的遮罩 */
  #sandbox-boot {
    position: fixed; inset: 0; z-index: 2147483600;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center;
    background: #1c1c1e; color: #f0e3d4;
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  }
  #sandbox-boot .t { font-size: 16px; font-weight: 600; letter-spacing: .08em; }
  #sandbox-boot .s { font-size: 12px; color: rgba(240, 227, 212, .55); line-height: 1.8; max-width: 300px; }
</style>
</head>
<body>
<div id="sandbox-root">

  <!-- ===================== 通话屏（与生产同一份 DOM） ===================== -->
    <div id="outgoing-call-screen" class="screen">
          <div class="outgoing-call-content">
            <div class="outgoing-call-avatar-wrap">
              <img id="outgoing-call-avatar" class="caller-avatar" src="">
              <img class="outgoing-call-avatar-frame" src="assets/live2d-call/video-call-avatar-frame-green.png" alt="">
            </div>
            <div id="outgoing-call-name" class="caller-name"></div>
            <div class="caller-text">正在呼叫...</div>
            <div class="outgoing-call-actions"> <button id="cancel-call-btn" class="call-action-btn decline"></button> <span data-lang-key="cancel">取消</span> </div>
          </div>
          <!-- 视频通话"启用音频"按钮 — 复用语音通话彩铃机制 (iOS Safari 音频解锁)
               v0.5.0 P25: 放在呼叫等待页 (#outgoing-call-screen) 内部、.outgoing-call-content 之外 —
                 · 在屏内 → 显隐跟着 .screen 的 active/opacity 走, 不再需要 JS 在每个出口手动管显隐
                 · 在 content 之外 → position:absolute 的定位基准是本屏 (跟原 #video-call-screen 内那颗等价),
                   不会被 .outgoing-call-content(被撑成"内容高度") 把 bottom:43px 抬到取消按钮附近
               跟语音通话 #voice-regenerate-call-btn 等价: 同一份 call-waiting.mp3, 同一个共享 AudioContext -->
          <button id="video-audio-unlock-btn" class="unlock-inactive">启用音频</button>
        </div>

    <div id="video-call-screen" class="screen">

    <div class="video-call-top-bar">
        <button id="minimize-call-btn" title="最小化">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
        <span id="call-timer">00:00</span>
    </div>

          <!-- 视频画面显示区 (优化模式) -->
          <div id="video-display-area" style="display: none;">
            <!-- 大屏：对方画面 -->
            <div id="remote-video-large" class="video-large-screen">
              <img id="remote-video-img" src="" alt="对方视频">
            </div>
            <!-- 小屏：我方画面 -->
            <div id="local-video-small" class="video-small-screen">
              <img id="local-video-img" src="" alt="我的视频" style="display: block;">
              <video id="local-camera-video" autoplay playsinline muted style="display: none; width: 100%; height: 100%; object-fit: cover;"></video>
            </div>
          </div>

          <div class="video-call-avatar-area">
            <div id="participant-avatars-grid"> </div>
          </div>
          <div id="video-call-status-text" class="voice-call-status-text" aria-live="polite"></div>
          <div id="video-call-main" class="video-call-main"> </div>

          <!-- v0.5.x: 玻璃 AI 对话气泡 (Galgame 风格) — 纯视觉空壳, 尚未接入 AI/ASR/TTS -->
          <div
              id="video-call-ai-glass-bubble"
              class="video-call-ai-glass-bubble is-hidden"
              aria-live="polite"
          >
              <span class="glass-bubble-highlight"></span>

              <div class="glass-bubble-name">
                  <span class="glass-bubble-status-dot"></span>
                  <span id="video-call-ai-glass-name">张怀瑾</span>
              </div>

              <div
                  id="video-call-ai-glass-text"
                  class="glass-bubble-text"
              >嗯……我在听，你慢慢说。</div>

              <span class="glass-bubble-spark spark-one">✦</span>
              <span class="glass-bubble-spark spark-two">✧</span>
          </div>

          <!-- 视频通话"启用音频"按钮 (按钮 DOM 已在 body 顶层, 见 </body> 前) -->

          <!-- v0.5.x: 视频通话控制按钮「装饰外框」— 绿色长方形透明 PNG
               (assets/live2d-call/视频通话正式页按钮框.png)
               独立装饰层: pointer-events:none, z-index:0, 不会拦截按钮点击,
               也不会盖在按钮上面。位置 / 尺寸见 css/video-voice-call.css
               #video-call-screen #video-call-controls-frame -->
          <div id="video-call-controls-frame" aria-hidden="true"></div>

          <div class="video-call-controls"> <button id="user-speak-btn" class="control-btn speak-btn"></button> <button id="hang-up-btn" class="control-btn hangup-btn"></button> <button id="model-manage-btn" class="control-btn model-manage-btn" title="模型管理" aria-label="模型管理"></button> <button id="regenerate-call-btn" class="control-btn regenerate-btn camera-switch-btn" title="切换前/后摄像头" aria-label="切换前/后摄像头"></button> <button id="join-call-btn"
              class="control-btn join-btn" style="display: none;"></button> </div>

          <!-- 模型管理面板 — 视频通话页面内浮层, 默认隐藏
               复用项目通用 .modal 模式, toggle visible 显示 -->
          <div id="model-management-panel" class="modal model-management-panel">
            <div class="modal-content model-management-content">
              <div class="modal-header model-management-header">
                <span class="model-management-title">模型管理</span>
                <button id="model-management-close-btn" class="model-management-close-btn" title="关闭" aria-label="关闭">×</button>
              </div>
              <div class="modal-body model-management-body">
                <!-- 表情: 按钮动态注入 + ↺ 默认 恢复用户保存的 defaultExpression -->
                <div class="model-management-section">
                  <div class="model-management-section-title">表情</div>
                  <div class="model-management-actions" id="model-management-expressions"></div>
                  <button type="button" class="model-management-action-reset" id="model-management-expression-reset" data-action="expression-reset" disabled title="未设置默认表情">↺ 默认</button>
                  <div class="model-management-empty" id="model-management-expressions-empty" style="display:none;">暂无可用表情</div>
                </div>
                <!-- 动作: 按钮动态注入, 按 group 分类来自 model3.json / data.config.refs -->
                <div class="model-management-section">
                  <div class="model-management-section-title">动作</div>
                  <div class="model-management-actions" id="model-management-motions"></div>
                  <div class="model-management-empty" id="model-management-motions-empty" style="display:none;">暂无可用动作</div>
                </div>
                <!-- 无模型 / 读取失败 提示 -->
                <div class="model-management-no-model" id="model-management-no-model" style="display:none;">尚未加载 Live2D 模型</div>
              </div>
            </div>
          </div>
        </div>

    <div id="voice-call-screen" class="screen">
          <!-- v0.2.30.28: 不再用独立光晕 div (会跑偏) — 改为 box-shadow 直接挂在按钮/头像上, 永远跟元素对齐 -->

          <div class="voice-call-top-bar">
            <button id="minimize-voice-call-btn" title="最小化">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
            <span id="voice-call-timer">00:00</span>
          </div>

          <div class="voice-call-avatar-area">
            <div id="voice-participant-avatars-grid"> </div>
          </div>
          <div id="voice-call-status-text" class="voice-call-status-text" aria-live="polite"></div>
          <!-- v0.2.30.24: 隐藏通话中的聊天记录显示框 — 通话期间不再显示 callHistory 气泡 -->
          <div id="voice-call-main" class="voice-call-main" style="display: none;"> </div>
          <div class="voice-call-controls">
            <!-- v0.2.30.24: 通话期间 speak-btn / unlock 按钮相对挂断键的位置由 voice-call-glow 联动控制 -->
            <button id="voice-user-speak-btn" class="control-btn speak-btn"></button>
            <button id="voice-hang-up-btn" class="control-btn hangup-btn"></button>
            <button id="voice-regenerate-call-btn" class="unlock-inactive">启用音频</button>
            <button id="voice-join-call-btn" class="control-btn join-btn" style="display: none;"></button>
          </div>
        </div>

  <!-- ===================== body 顶层: 最小化恢复按钮 ===================== -->
  <!-- minimizeVideoCall() 会去 getElementById 找这两个, 缺了会抛错 -->
    <div id="video-call-restore-btn" style="display: none;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
    </div>
    <div id="voice-call-restore-btn" style="display: none;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
    </div>

</div>

<!-- ===================== 音频播放器（tts-audio.js 必需） ===================== -->
<!-- 这三个 id 是 tts-audio.js 硬依赖, 缺了 TTS 播不出来 -->
<audio id="silent-audio-player" loop preload="auto" style="display:none;">
  <source src="https://phoebeboo.github.io/mewoooo/1-second-of-silence.mp3" type="audio/mpeg">
</audio>
<audio id="tts-audio-player" style="display:none;"></audio>
<audio id="call-tts-audio-player" style="display:none;"></audio>

<!-- ===================== 启动遮罩 ===================== -->
<div id="sandbox-boot">
  <div class="t">视频通话</div>
  <div class="s" id="sandbox-boot-msg">正在连接…</div>
  <div class="s" style="font-size:11px;opacity:.6;">如果一直停在这里，点下面的「返回」退回主页面</div>
</div>

<!-- ============================================================================
     JS 加载顺序（不能乱）
     ----------------------------------------------------------------------------
     1. Live2D 引擎三件套 —— live2d-loader.js 依赖 PIXI 先就位
     2. Dexie —— init-db-schema.js 要 new Dexie()
     3. globals.js —— 先把 window.state / 宿主桩 / 抄来的纯函数放好,
                      后面所有模块加载时若摸到它们不会 undefined
     4. 数据层 —— window.db（同源同库, 直接读宿主那份 IndexedDB）
     5. 记忆层 —— 通话拼 prompt 要 serializeForPrompt / serializeCoreMemories
     6. Live2D 链 —— storage → ui → loader
     7. 口型 + TTS 链
     8. video-optimization（摄像头） / asr（语音识别） / api-endpoint-presets
     9. 最后才是 video-voice-call.js 本体
  ============================================================================ -->
<script src="lib/live2dcubismcore.min.js"></script>
<script src="lib/live2d.min.js"></script>
<script src="lib/pixi.min.js"></script>
<script src="lib/pixi-live2d-display.cubism4.min.js"></script>

<script src="https://unpkg.com/dexie/dist/dexie.js"></script>

<!-- ⚠️ modules/ui-loaders.js 必须排在 sandbox-globals.js 【前面】
     原因: sandbox-globals.js:347 自己有一份 getTimeOfDayGreeting (分档更细:
     凌晨/早上/上午/中午/下午/傍晚/晚上/深夜), 排在后面会把这份覆盖掉。
     这个文件在宿主 index.html 里也是靠 ui-loaders.js 提供, 沙盒不加载它就会:
       - video-voice-call.js:2699 / :4182  → formatTimeAgo(...) ReferenceError
         (AI 开口说话时炸, 报 "Can't find variable: formatTimeAgo")
       - tts-audio.js:1182 / :1218          → parseMarkdown(...) ReferenceError
     ui-loaders.js 加载时零副作用 (全是函数定义 + 末尾统一挂 window), 不会碰 DOM。 -->
<script src="modules/ui-loaders.js?v=0.0.36"></script>
