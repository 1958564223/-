<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cinema 沙盒验证 (iframe 测试)</title>
<!--
  ============================================================================
  🧪 Cinema 沙盒验证页 (2026-10-09) —— 临时, 验证完整个删掉

  目的: 验证「把影院放进一个只有约 150 节点的纯净 iframe 文档」能不能根治
        iOS 点击输入框时主线程冻结 4~5 秒的问题。

  为什么会有这个页面:
    实测排除了一堆东西 —— 毛玻璃、抽帧 toDataURL、input 事件处理、
    height 过渡动画、kb-open 焦点监听、body:fixed、宿主 display:none(反而慢一倍)、
    甚至完全断开 visualViewport 同步(仍然 5,072ms 冻结)……
    全部不是元凶。

    剩下唯一还没验的假设: 【房间所在的宿主页面越大, WebKit 算 Focus Rect
    越慢】。证据是: 独立测试页(本文件的原型)从来没卡过, 而它和 330 用的是
    同一份 cinema-room.js、同样有 fixed 覆盖层 —— 唯一差别是它底下只有
    约 150 个节点, 330 有 3,552 个。

  所以: 把这个页面用全屏 <iframe> 嵌进完整 330 里, 点输入框试一下。
    · 不卡   → 假设成立, iframe 重构有依据
    · 照样卡 → 假设不成立, 换思路

  ⚠️ 这不是成品: 设置弹窗 / 人物拖拽 / 剧情记忆那些依赖 330 宿主的
     showCustomAlert 等函数, 在这个沙盒里是没有的。只测输入框响应速度。
  ============================================================================ -->
<link rel="stylesheet" href="../modules/cinema-room.css">
<style>
  body {
    margin: 0; background: #16111a; color: #f0e3d4;
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px 40px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 18px; letter-spacing: .12em; margin: 0 0 4px; color: #f0dcc4; }
  .sub { font-size: 12px; color: rgba(240,220,196,.55); line-height: 1.7; margin-bottom: 16px; }
  .card {
    background: rgba(255,255,255,.05); border: 1px solid rgba(216,168,116,.18);
    border-radius: 12px; padding: 13px; margin-bottom: 10px;
  }
  .card h2 { margin: 0 0 8px; font-size: 13.5px; color: #ffd9a8; font-weight: 700; }
  label { display: block; font-size: 11.5px; color: rgba(240,220,196,.62); margin: 8px 0 4px; }
  input, textarea, select {
    width: 100%; box-sizing: border-box; padding: 9px 11px; border-radius: 9px;
    border: 1px solid rgba(216,168,116,.28); background: rgba(0,0,0,.34);
    color: #f0e3d4; font-size: 13.5px; font-family: inherit;
  }
  textarea { min-height: 84px; resize: vertical; }
  button {
    padding: 11px 18px; border-radius: 999px; margin-top: 10px; margin-right: 8px;
    border: 1px solid rgba(216,168,116,.38);
    background: linear-gradient(180deg, rgba(216,168,116,.30), rgba(180,128,80,.20));
    color: #ffeacd; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: transparent; color: rgba(240,220,196,.62); }
  .log {
    font: 11.5px/1.6 ui-monospace, Menlo, monospace; white-space: pre-wrap;
    background: #000; border-radius: 9px; padding: 9px; max-height: 190px; overflow: auto;
    border: 1px solid rgba(216,168,116,.2);
  }
  .stat { font-size: 12px; color: rgba(240,220,196,.62); margin-top: 6px; line-height: 1.8; }
  .warn { color: #ffcf9c; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Cinema Room 独立测试</h1>
  <div class="sub">
    这个页面只加载观影房自己的模块（不拉整套 330），所以秒开。<br>
    Live 要走 http(s)，<b>不能用 file:// 打开</b>，必须走局域网地址。
  </div>

  <div class="card">
    <h2>1 · 你的角色（就是这台 PWA 在跑的那个人设）</h2>
    <label>角色名</label>
    <input id="f-name" value="张怀瑾">
    <label>人设（AI 性格设定，和主聊天是同一份）</label>
    <textarea id="f-persona">你是一个温柔、体贴、会陪用户一起看电影的伙伴。说话自然简洁，中文。</textarea>
    <label>你的称呼</label>
    <input id="f-nick" value="我">
  </div>

  <div class="card">
    <h2>2 · Gemini Live 密钥</h2>
    <label>API Key（只存在这台手机的 localStorage 里）</label>
    <input id="f-key" type="password" placeholder="粘贴你的 Gemini API Key" autocomplete="off">
    <div class="stat">存在浏览器本地，不上传。填好后播片就会自动连。</div>
  </div>

  <div class="card">
    <h2>3 · 进房间</h2>
    <button id="btn-save">保存设置</button>
    <button class="ghost" id="btn-open">打开 Cinema Room</button>
    <div class="stat" id="stat">状态：未初始化</div>
    <div class="stat">
      <button class="ghost" id="btn-clearsession" style="margin-top:8px">清除断线存档点（连上秒断时点这个）</button>
    </div>
  </div>

  <div class="card">
    <h2>运行日志</h2>
    <div class="log" id="log"></div>
  </div>
</div>

<script src="./dexie.js"></script>
<script>
// ---- db ----
// 三张 Cinema 表用【真 Dexie】, 和生产环境完全一致。
// ⚠️ 之前这里图省事用 localStorage 桩, 结果没有 cinemaFilms/cinemaBlobs/cinemaProgress,
//    上传视频直接报"数据表缺失"。Blob 根本没法 JSON 序列化, 必须用 IndexedDB。
// chat 表则是 localStorage 桩 —— Cinema Live 只会 db.chats.put() 存记忆, 不需要 Dexie。
var cdb = new Dexie('CinemaStandaloneDB');
cdb.version(65).stores({
  cinemaFilms: '&id, name, addedAt, size',
  cinemaBlobs: '&id',
  cinemaProgress: '&filmId, updatedAt'
});

var KEY_CHAT = 'cinema_test_chat';
var KEY_KEY  = 'cinema_test_apikey';

var chat = {
  id: 'cinema-local',
  name: '张怀瑾',
  originalName: '张怀瑾',
  settings: { aiPersona: '', myPersona: '', myNickname: '我' },
  watchTogetherSettings: { geminiApiKey: '' },
  longTermMemory: []
};
try { var saved = JSON.parse(localStorage.getItem(KEY_CHAT) || 'null'); if (saved) chat = saved; } catch (e) {}
chat.settings.aiPersona = document.getElementById('f-persona').value;
chat.name = chat.originalName = document.getElementById('f-name').value;
chat.settings.myNickname = document.getElementById('f-nick').value;
chat.watchTogetherSettings.geminiApiKey = localStorage.getItem(KEY_KEY) || '';
document.getElementById('f-key').value = chat.watchTogetherSettings.geminiApiKey;

// chats 用 localStorage; 其余三张表直接用 Dexie
cdb.chats = {
  put: function (c) { localStorage.setItem(KEY_CHAT, JSON.stringify(c)); return Promise.resolve(); },
  get: function (id) { return Promise.resolve(chat); },
  delete: function (id) { return Promise.resolve(); }
};

window.db = cdb;
window.dbReadyPromise = cdb.open();
window.state = { activeChatId: 'cinema-local', chats: { 'cinema-local': chat } };

// ---- UI ----
var logEl = document.getElementById('log');
function log(m) {
  var d = document.createElement('div');
  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + m;
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
}
window.__testLog = log;
var origWarn = console.warn, origErr = console.error;
console.warn = function () { log('WARN ' + [].join.call(arguments, ' ')); origWarn.apply(console, arguments); };
console.error = function () { log('ERR  ' + [].join.call(arguments, ' ')); origErr.apply(console, arguments); };

function refreshStat() {
  var s = document.getElementById('stat');
  var hasKey = !!chat.watchTogetherSettings.geminiApiKey;
  var yn = function (b) { return b ? '<span style="color:#7ee787">就绪</span>' : '<span class="warn">缺</span>'; };
  s.innerHTML = '状态：<br>' +
    '　角色「' + chat.name + '」　密钥 ' +
      (hasKey ? '<span style="color:#7ee787">已填</span>' : '<span class="warn">未填</span>') + '<br>' +
    '　CinemaRoom ' + yn(!!window.CinemaRoom) +
    '　CinemaStorage ' + yn(!!window.CinemaStorage) +
    '　CinemaLive ' + yn(!!window.CinemaLive) +
    '　LiveClient ' + yn(!!window.LiveClient) + '<br>' +
    '　数据表 ' + yn(!!(window.db && window.db.cinemaFilms && window.db.cinemaBlobs && window.db.cinemaProgress)) +
    '　长期记忆 ' + chat.longTermMemory.length + ' 条';
}

document.getElementById('btn-save').addEventListener('click', function () {
  chat.name = chat.originalName = document.getElementById('f-name').value.trim() || '角色';
  chat.settings.aiPersona = document.getElementById('f-persona').value;
  chat.settings.myNickname = document.getElementById('f-nick').value.trim() || '我';
  chat.watchTogetherSettings.geminiApiKey = document.getElementById('f-key').value.trim();
  localStorage.setItem(KEY_KEY, chat.watchTogetherSettings.geminiApiKey);
  window.state.chats['cinema-local'] = chat;
  window.db.chats.put(chat);
  log('设置已保存到本机 localStorage');
  refreshStat();
});

document.getElementById('btn-clearsession').addEventListener('click', function () {
  var n = 0;
  ['cinema_gemini_live_resume_handle', 'wt_gemini_live_resume_handle'].forEach(function (k) {
    if (localStorage.getItem(k)) { localStorage.removeItem(k); n++; }
  });
  log(n ? ('已清除 ' + n + ' 个存档点。下次播放会用全新会话。') : '本来就没有存档点');
});

document.getElementById('btn-open').addEventListener('click', function () {
  if (window.CinemaRoom) { window.CinemaRoom.open(); log('已打开 Cinema Room'); }
  else log('CinemaRoom 没加载');
});

setInterval(refreshStat, 800);
refreshStat();
window.addEventListener('load', function () { log('页面资源加载完成'); });
</script>

<!-- 协议层 + 桥接层 + 房间 + 存储 (只有这四个, 不含 330 其他任何东西) -->
<script src="../modules/live-client.js"></script>
<script src="../modules/cinema-storage.js"></script>
<script src="../modules/cinema-room.js"></script>
<script src="../modules/cinema-live.js"></script>
<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    refreshStat();
    log('模块就绪：CinemaRoom=' + !!window.CinemaRoom + ' CinemaStorage=' + !!window.CinemaStorage +
        ' CinemaLive=' + !!window.CinemaLive + ' LiveClient=' + !!window.LiveClient);
  }, 120);
});
</script>
</body>
</html>
