<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cinema Room (iframe 沙盒)</title>
<!-- ⚠️ 影院本体样式, 和生产完全同一份文件。上一版重写时漏了这行, 导致整个房间裸奔。 -->
<link rel="stylesheet" href="../modules/cinema-room.css">
<!--
  ============================================================================
  Cinema Room · iframe 沙盒 (2026-10-09)

  这个页面【就是】影院本体, 跑的是和生产完全相同的模块文件:
    ../modules/cinema-room.css
    ../modules/live-client.js
    ../modules/cinema-storage.js
    ../modules/cinema-img.js
    ../modules/cinema-room.js
    ../modules/cinema-live.js

  为什么它不卡、集成进 330 之后卡:
    本页整个文档只有约 54 个 DOM 节点; 完整 330 宿主有 3,552 个。
    代码一模一样, 差别只有宿主。iframe 就是把这个差别彻底隔开。

  和宿主的通信 (postMessage):
    宿主 → 本页  { type:'cinema:init', chat:{ id, name, originalName,
                                            settings:{aiPersona,myPersona,myNickname},
                                            watchTogetherSettings:{geminiApiKey},
                                            longTermMemory:[] } }
    本页 → 宿主  { type:'cinema:ready' }        模块都就绪了
                  { type:'cinema:needChat' }     缺聊天数据, 请再发一次
                  { type:'cinema:memory', text }  最终观影记忆写好了
                  { type:'cinema:closed' }      用户退出了影院

  单独在浏览器里直接打开本页(不在 iframe 里)时, 走本地兜底数据,
  方便开发时单独调试。
  ============================================================================ -->
<style>
  html,body{margin:0;height:100%;background:#16111a;color:#f0e3d4;
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;padding:24px;text-align:center;}
  #boot .t{font-size:16px;font-weight:600;letter-spacing:.1em}
  #boot .s{font-size:12px;color:rgba(240,220,196,.55);line-height:1.8;max-width:320px}
  #boot button{margin-top:6px;padding:10px 22px;border-radius:999px;font:inherit;
    font-size:13px;background:#2a4a7c;color:#fff;border:0}
</style>
</head>
<body>

<div id="boot">
  <div class="t">Cinema Room</div>
  <div class="s" id="bootMsg">正在连接 330 宿主…</div>
  <button id="bootBtn" style="display:none">用本机数据进入</button>
</div>

<!-- 三张影片表用【真 Dexie】, 和生产完全一致。Blob 没法 JSON 序列化, 必须 IndexedDB。 -->
<script src="./dexie.js"></script>
<script>
(function () {
  'use strict';

  // ===================== 1. IndexedDB: 影片 / 进度 / 道具 =====================
  var cdb = new Dexie('CinemaSandboxDB');
  cdb.version(65).stores({
    cinemaFilms: '&id, name, addedAt, size',
    cinemaBlobs: '&id',
    cinemaProgress: '&filmId, updatedAt'
  });

  // ===================== 2. 和宿主对话 =====================
  var IN_IFRAME = (window.parent && window.parent !== window);
  var booted = false;

  function post(msg) {
    if (!IN_IFRAME) return;
    try { window.parent.postMessage(msg, '*'); } catch (e) { /* noop */ }
  }

  function log() {
    // 沙盒里不刷屏, 只在控制台留一行
    try { console.log.apply(console, ['[CinemaSandbox]'].concat([].slice.call(arguments))); }
    catch (e) { /* noop */ }
  }

  // ===================== 3. 本机兜底数据(不在 iframe 里时用) =====================
  var LS_CHAT = 'cinema_sandbox_chat_fallback';
  function fallbackChat() {
    var c = {
      id: 'cinema-local',
      name: '本地', originalName: '本地',
      settings: { aiPersona: '', myPersona: '', myNickname: '我' },
      watchTogetherSettings: { geminiApiKey: '' },
      longTermMemory: []
    };
    try { var s = JSON.parse(localStorage.getItem(LS_CHAT) || 'null'); if (s && s.id) c = s; } catch (e) {}
    return c;
  }

  // ===================== 4. 聊天表 =====================
  // 生产环境里 chat 表在宿主 Dexie 里; 沙盒里收不到那个库,
  // 所以 put 走 postMessage 交给宿主写, 同时本地留一份兜底。
  //
  // ⚠️ 长期记忆条目的格式(整个 330 都是这一种, 见 cinema-live.js:1193):
  //     { content: '...', timestamp: 1730000000000, source: 'cinema_watch_summary' }
  //   —— 是【对象】不是字符串。
  //   之前这里直接取 longTermMemory.slice(-1)[0] 就往宿主发, 宿主那边
  //   String() 一转, 记忆库就被写成了 7 个 "[object Object]",
  //   记忆首页还显示 7 条, 点进去却一条都渲染不出来。
  var currentChat = null;
  var lastSentMemory = '';
  function extractMemoryText(c) {
    if (!c) return '';
    var mem = c.longTermMemory;
    if (!Array.isArray(mem) || !mem.length) return '';
    var last = mem[mem.length - 1];
    if (last && typeof last === 'object') return String(last.content || '');
    return String(last || '');   // 兼容万一存成了字符串
  }
  cdb.chats = {
    put: function (c) {
      currentChat = c;
      try { localStorage.setItem(LS_CHAT, JSON.stringify(c)); } catch (e) {}
      // 只在真的有【新的】最终记忆时才通知宿主, 免得每存一次进度就多写一条
      var text = extractMemoryText(c);
      if (text && text !== lastSentMemory) {
        lastSentMemory = text;
        post({ type: 'cinema:memory', text: text });
      }
      return Promise.resolve();
    },
    get: function () { return Promise.resolve(currentChat || fallbackChat()); },
    delete: function () { return Promise.resolve(); }
  };
  window.db = cdb;
  window.dbReadyPromise = cdb.open();

  // ===================== 5. 本地 UI 函数(替代宿主的同名函数) =====================
  // 影院模块会调 window.showCustomAlert / showCustomConfirm / showToast,
  // 这三个在宿主里存在, 但 iframe 里拿不到, 这里自己实现一份最小可用的。
  //
  // ⚠️ 返回值必须跟宿主一致, 否则调用方的判断会全部落空:
  //     showCustomConfirm(...) → Promise<true|false>
  //   影院里 deleteFilm 和 showLeaveFallback 都是按 true/false 判断的。
  //
  // ⚠️ 影院自己的 closeAnyModal() 找的是宿主的 #custom-modal-overlay,
  //   在 iframe 里那个节点根本不存在 → 关不掉我们这里的框。
  //   所以这里记下当前弹层, 由 8 节「房间关闭」监听负责清掉。
  var sandboxModal = null;
  function closeSandboxModal() {
    if (sandboxModal && sandboxModal.parentNode) sandboxModal.remove();
    sandboxModal = null;
  }

  function simpleBox(html, buttons) {
    return new Promise(function (resolve) {
      closeSandboxModal();
      var ov = document.createElement('div');
      sandboxModal = ov;
      ov.style.cssText = 'position:fixed;inset:0;z-index:2147483646;background:rgba(0,0,0,.62);' +
        'display:flex;align-items:center;justify-content:center;padding:24px;';
      var box = document.createElement('div');
      box.style.cssText = 'max-width:360px;width:100%;background:#221a16;color:#f0e3d4;' +
        'border:1px solid rgba(216,168,116,.24);border-radius:14px;padding:18px;line-height:1.7;font-size:14px;';
      box.innerHTML = html;
      var bar = document.createElement('div');
      bar.style.cssText = 'display:flex;gap:10px;justify-content:flex-end;margin-top:16px;';
      buttons.forEach(function (b) {
        var el = document.createElement('button');
        el.textContent = b.label;
        el.style.cssText = 'padding:9px 18px;border-radius:999px;border:0;font:inherit;font-size:13px;' +
          'background:' + (b.primary ? '#8a5a2e' : '#3a2f28') + ';color:#fff;';
        el.onclick = function () { closeSandboxModal(); resolve(b.value); };
        bar.appendChild(el);
      });
      box.appendChild(bar);
      ov.appendChild(box);
      document.body.appendChild(ov);
    });
  }

  window.showCustomAlert = function (title, body) {
    return simpleBox('<div style="font-weight:600;margin-bottom:8px">' + (title || '提示') + '</div>' +
      '<div style="white-space:pre-wrap">' + (body || '') + '</div>',
      [{ label: '知道了', value: true, primary: true }]).then(function () { return true; });
  };

  window.showCustomConfirm = function (title, body, opts) {
    opts = opts || {};
    return simpleBox('<div style="font-weight:600;margin-bottom:8px">' + (title || '确认') + '</div>' +
      '<div style="white-space:pre-wrap">' + (body || '') + '</div>',
      [{ label: opts.cancelText || '取消', value: false },
       { label: opts.confirmText || '确定', value: true, primary: true }]);
  };

  window.showToast = function (text) {
    var t = document.createElement('div');
    t.textContent = text;
    t.style.cssText = 'position:fixed;left:50%;bottom:14%;transform:translateX(-50%);z-index:2147483646;' +
      'background:rgba(0,0,0,.86);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;max-width:80%;';
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  };

  // ===================== 6. 进房 =====================
  function boot(chat) {
    if (booted) return;
    booted = true;
    currentChat = chat || fallbackChat();
    window.state = { activeChatId: currentChat.id, chats: {} };
    window.state.chats[currentChat.id] = currentChat;

    // ★ 让房间【不要】自己读 visualViewport。
    //   iframe 里的 visualViewport 反映不了 iOS 键盘, 房间拿它算出来的
    //   --cinema-vv-height 是错的, 还会把宿主转发来的正确值覆盖掉。
    //   这里直接让它读不到 → 影院内部的 initVisualViewport 会 early-return,
    //   于是房间里那两个 CSS 变量【只由宿主的数据驱动】。
    try {
      Object.defineProperty(window, 'visualViewport', { get: function () { return null; }, configurable: true });
    } catch (e) { /* 老浏览器读不到就认了, 顶多是房间自己那份不准 */ }

    try { document.getElementById('boot').style.display = 'none'; } catch (e) {}
    try {
      window.CinemaRoom.open();
      post({ type: 'cinema:ready' });
    } catch (e) {
      log('开房失败', e && e.message);
    }
  }

  // ===================== 7. 收宿主的 init =====================
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'cinema:init' && d.chat) {
      boot(d.chat);
    } else if (d.type === 'cinema:vv') {
      // ★ 宿主转发的键盘视口。
      //   iframe 里的 window.visualViewport 不会反映 iOS 键盘(键盘压的是顶层视口),
      //   所以房间在自己这儿永远算不出该让多少 → 打字时键盘直接盖住播放器。
      //   宿主在顶层能正确读到, 通过 postMessage 告诉我们, 这里写进 CSS 变量。
      applyViewport(d.height, d.offsetTop);
    } else if (d.type === 'cinema:key') {
      // 单独补一个 key(用户在影院设置面板里改了也能同步回去)
      if (currentChat) {
        currentChat.watchTogetherSettings = currentChat.watchTogetherSettings || {};
        currentChat.watchTogetherSettings.geminiApiKey = d.key || '';
        post({ type: 'cinema:keyChanged', key: d.key || '' });
      }
    }
  });

  // ===================== 7b. 应用宿主给的可视视口 =====================
  var lastVV = { h: -1, t: -1 };
  function applyViewport(h, t) {
    if (typeof h !== 'number' || h <= 0) return;
    if (h === lastVV.h && t === lastVV.t) return;   // 没变就不碰 DOM
    lastVV = { h: h, t: t };
    var room = document.getElementById('cinema-room');
    if (!room) return;
    try {
      room.style.setProperty('--cinema-vv-height', h + 'px');
      room.style.setProperty('--cinema-vv-top', Math.max(0, t || 0) + 'px');
      // 顶栏高度也随布局变, 让影院自己重新量一次(它内部有 syncTopbarHeight)
      if (typeof global.CinemaRoom === 'undefined' && window.CinemaRoom) { /* noop */ }
    } catch (e) { /* noop */ }
  }

  // ===================== 8. 退出影院 → 告诉宿主把 iframe 收掉 =====================
  // 影院关闭时 body 会摘掉 cinema-room-active, 这里盯着这个 class。
  (function watchClose() {
    if (!document.body) return;
    var onClass = function () {
      if (!document.body.classList.contains('cinema-room-active')) {
        // 房间关了 → 顺手把还开着的弹框收掉。
        // 影院自己的 closeAnyModal() 找的是宿主的 #custom-modal-overlay,
        // 在 iframe 里那个节点不存在, 不在这里清的话, 「10 秒自动退出」
        // 走完之后弹框会留在屏幕上不走。
        closeSandboxModal();
        post({ type: 'cinema:closed' });
      }
    };
    try {
      new MutationObserver(onClass).observe(document.body, { attributes: true, attributeFilter: ['class'] });
    } catch (e) {
      setInterval(onClass, 500);   // 兜底
    }
  })();

  // ===================== 9. 启动 =====================
  function start() {
    if (IN_IFRAME) {
      // 在 iframe 里: 向宿主要聊天数据; 2 秒还没来就走本机兜底
      post({ type: 'cinema:needChat' });
      var btn = document.getElementById('bootBtn');
      var msg = document.getElementById('bootMsg');
      setTimeout(function () {
        if (!booted) {
          if (msg) msg.textContent = '没收到 330 的聊天数据，可以先用本机数据进入影院。';
          if (btn) btn.style.display = 'inline-block';
        }
      }, 2000);
      var b = document.getElementById('bootBtn');
      if (b) b.addEventListener('click', function () { boot(fallbackChat()); });
    } else {
      boot(fallbackChat());   // 直接在浏览器里打开 → 本机数据
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      Promise.resolve(window.dbReadyPromise).then(start).catch(start);
    });
  } else {
    Promise.resolve(window.dbReadyPromise).then(start).catch(start);
  }
})();
</script>

<!-- 协议层 + 桥接层 + 房间 + 存储 + 图片压缩 (和生产完全同一批文件) -->
<script src="../modules/live-client.js"></script>
<script src="../modules/cinema-storage.js"></script>
<script src="../modules/cinema-img.js"></script>
<script src="../modules/cinema-room.js"></script>
<script src="../modules/cinema-live.js"></script>

</body>
</html>
